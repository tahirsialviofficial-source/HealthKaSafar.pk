name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        id: p
        run: |
          mkdir -p unpacked
          for z in *.zip; do
            if [ -e "$z" ]; then unzip -q -o "$z" -d unpacked; fi
          done
          f=$(find . -name settings.gradle | head -1)
          if [ -z "$f" ]; then echo "settings.gradle nahi mili - zip upload hua?"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HealthKaSafar-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
